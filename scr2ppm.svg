<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a9df0"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dce9fb"/>
    </linearGradient>
  </defs>
  <!-- stand -->
  <path d="M52 92h24l4 12H48z" fill="#62a0ea"/>
  <rect x="38" y="102" width="52" height="8" rx="4" fill="#3584e4"/>
  <!-- monitor body -->
  <rect x="14" y="18" width="100" height="76" rx="10" fill="url(#body)"/>
  <!-- screen -->
  <rect x="21" y="25" width="86" height="58" rx="4" fill="url(#screen)"/>
  <!-- capture selection: red border, drained clockwise to blue -->
  <rect x="34" y="35" width="60" height="38" fill="#0a84ff" fill-opacity="0.08"/>
  <rect x="34" y="35" width="60" height="38"
        fill="none" stroke="#ff3b30" stroke-width="5"/>
  <rect x="34" y="35" width="60" height="38"
        fill="none" stroke="#0a84ff" stroke-width="5" stroke-dasharray="75 121"/>
  <rect x="31.5" y="32.5" width="5" height="5" fill="#0a84ff"/>
  <!-- mouse pointer dragging the selection -->
  <path d="M90 68v22l6-5.5 4.5 10 4-1.8-4.5-9.7H108z"
        fill="#ffffff" stroke="#26456e" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
