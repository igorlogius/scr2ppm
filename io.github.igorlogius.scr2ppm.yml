app-id: io.github.igorlogius.scr2ppm
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: scr2ppm
rename-icon: scr2ppm
rename-desktop-file: scr2ppm.desktop
rename-appdata-file: scr2ppm.metainfo.xml
finish-args:
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --filesystem=xdg-pictures:create

modules:
  - name: glew
    buildsystem: cmake-ninja
    subdir: build/cmake
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_UTILS=OFF
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://github.com/nigels-com/glew/releases/download/glew-2.2.0/glew-2.2.0.tgz
        sha256: d4fc82893cfb00109578d0a1a2337fb8ca335b3ceccf97b97e5cc7f08e4353e1

  - name: glm
    buildsystem: cmake-ninja
    config-opts:
      - -DGLM_BUILD_TESTS=OFF
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/g-truc/glm.git
        tag: 1.0.2
        commit: a532f5b1cf27d6a3c099437e6959cf7e398a0a67

  - name: slop
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_CXX_FLAGS=-DGLEW_NO_GLU
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/naelstrof/slop.git
        commit: b0228305332da465d536cae533895934ab0ac58b
    cleanup:
      - /share/doc
      - /share/man

  - name: scr2ppm
    buildsystem: simple
    build-commands:
      - cc scr2ppm.c -lX11 -lxcb -lXau -lXdmcp -o scr2ppm
      - cc scr2ppm-gui.c $(pkg-config --cflags --libs xft) -lX11 -o scr2ppm-gui
      - cc ppm2img.c -lm -o ppm2img
      - cc scr2ppm-clip.c -lX11 -o scr2ppm-clip
      - cc choosedir.c $(pkg-config --cflags --libs gio-2.0) -o scr2ppm-choosedir
      - install -D scr2ppm /app/bin/scr2ppm
      - install -D scr2ppm-gui /app/bin/scr2ppm-gui
      - install -D ppm2img /app/bin/ppm2img
      - install -D scr2ppm-clip /app/bin/scr2ppm-clip
      - install -D scr2ppm-choosedir /app/bin/scr2ppm-choosedir
      - install -D scr2ppm-wrapper /app/bin/scr2ppm-wrapper
      - install -D scr2ppm.desktop /app/share/applications/scr2ppm.desktop
      - install -D scr2ppm.metainfo.xml /app/share/metainfo/scr2ppm.metainfo.xml
      - install -D scr2ppm.svg /app/share/icons/hicolor/scalable/apps/scr2ppm.svg
    sources:
      - type: dir
        path: .
